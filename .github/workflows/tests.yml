name: Offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public fixtures and controlled transports
        run: python3 -B -m unittest discover -s tests -v
      - name: Reproduce the public demonstration
        run: |
          python3 -B -m src.demo --format json > /tmp/demo-first.json
          python3 -B -m src.demo --format json > /tmp/demo-second.json
          cmp /tmp/demo-first.json /tmp/demo-second.json
          python3 -B -m src.demo --method equal
          python3 -B -m src.readme_demo --check-docs
          python3 -B -m src.readme_demo --format json > /tmp/saved-first.json
          python3 -B -m src.readme_demo --format json > /tmp/saved-second.json
          cmp /tmp/saved-first.json /tmp/saved-second.json
